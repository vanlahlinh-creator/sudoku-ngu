<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku Chán Mớ Đời</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2a2354;--bg2:#13102b;--panel:rgba(255,255,255,.06);--ink:#e6e2f5;--mute:#a49dc9;--line:rgba(255,255,255,.12);--thick:#a396dc;--cell:#1b1640;--given:#e6e2f5;--mine:#9db6f2;--sel:#5e4fb8;--peer:#241d52;--same:#512a58;--acc:#e8558f;--acc-ink:#fff;--bad:#d9526a;--good:#3bb98c;--gold:#e0b441;--sh:0 14px 36px rgba(0,0,0,.45);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1b6b;--bg2:#0d0826;--panel:rgba(255,255,255,.07);--ink:#f4f0ff;--mute:#aca2dc;--line:rgba(255,255,255,.13);--thick:#b9a8ff;--cell:#191040;--given:#f4f0ff;--mine:#8fb4ff;--sel:#7a5cff;--peer:#241857;--same:#6b2b66;--acc:#ff4f93;--bad:#ff5c6c;--good:#38e0a0;--sh:0 18px 50px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2b1b6b;--bg2:#0d0826;--panel:rgba(255,255,255,.07);--ink:#f4f0ff;--mute:#aca2dc;--line:rgba(255,255,255,.13);--thick:#b9a8ff;--cell:#191040;--given:#f4f0ff;--mine:#8fb4ff;--sel:#7a5cff;--peer:#241857;--same:#6b2b66;--acc:#ff4f93;--bad:#ff5c6c;--good:#38e0a0;--sh:0 18px 50px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;background:radial-gradient(900px 600px at 50% -10%,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:560px;height:560px;border-radius:50%;pointer-events:none;z-index:0}
body::before{left:-200px;top:-160px;background:radial-gradient(closest-side,rgba(255,61,129,.14),transparent)}
body::after{right:-220px;bottom:-200px;background:radial-gradient(closest-side,rgba(61,150,255,.14),transparent)}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 14px 44px}
h1{margin:0;text-align:center;font-size:clamp(30px,9vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1.02}
h1 em{display:block;font-style:normal;background:linear-gradient(90deg,#e8649a,#e8985a 55%,#e8c46a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 12px rgba(255,61,129,.35))}
.sub{text-align:center;color:var(--mute);margin:10px 0 18px;font-size:14px}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 4px 8px;text-align:center;backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(30,10,90,.12)}
.st small{display:block;color:var(--mute);font-size:11px;font-weight:700}
.st b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.hearts{font-size:14px;letter-spacing:0}
.chips{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 20px;border-radius:99px;font:800 13px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#d44f82,#d97b48);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(255,61,129,.4)}
.bwrap{padding:4px;border-radius:24px;background:conic-gradient(from 200deg,#b8587f,#b98a4a,#4a9c80,#5a7fb8,#7f63b8,#b8587f);box-shadow:var(--sh)}
.board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;border-radius:19px;overflow:hidden;background:var(--cell)}
.c{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--cell);color:var(--given);font:800 clamp(18px,6vw,28px) inherit;font-family:inherit;padding:0;display:grid;place-items:center;cursor:pointer;min-width:0;transition:background .12s}
.c.r3{border-right:2.5px solid var(--thick)}.c.b3{border-bottom:2.5px solid var(--thick)}
.c.r8{border-right:0}.c.b8{border-bottom:0}
.c:hover{background:var(--peer)}
.c.peer{background:var(--peer)}
.c.same{background:var(--same)}
.c.sel{background:var(--sel);color:#fff;box-shadow:inset 0 0 0 3px var(--acc)}
.c.l{color:var(--mine);font-weight:700}
.c.bad{color:#fff;background:var(--bad);animation:shake .4s}
.c.pop{animation:pop .35s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-top:16px}
.pad button{aspect-ratio:.78;border:0;border-radius:13px;background:linear-gradient(160deg,hsl(var(--h) 46% 52%),hsl(calc(var(--h) + 28) 46% 42%));color:#fff;font:900 clamp(18px,6vw,26px) inherit;font-family:inherit;cursor:pointer;position:relative;display:grid;place-items:center;padding:0 0 6px;box-shadow:0 5px 0 hsl(var(--h) 70% 34%),0 8px 14px rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.pad button i{position:absolute;bottom:3px;font-style:normal;font-size:10px;font-weight:700;opacity:.85}
.pad button:active{transform:translateY(4px);box-shadow:0 1px 0 hsl(var(--h) 70% 34%)}
.pad button:disabled{opacity:.28;cursor:default;box-shadow:none;filter:grayscale(.6)}
.acts{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:15px;padding:14px;font:800 15px inherit;font-family:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--ink);backdrop-filter:blur(8px)}
.btn.pri{background:linear-gradient(135deg,#d44f82,#d97b48);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(255,61,129,.4)}
#pop{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.5);z-index:30;pointer-events:none;opacity:0;font-weight:900;font-size:clamp(22px,6.4vw,34px);line-height:1.2;text-align:center;width:max-content;max-width:88vw;padding:14px 22px 16px;border-radius:24px;color:#fff}
#pop .em{display:block;font-size:clamp(46px,13vw,68px);line-height:1.1;margin-bottom:2px}
#pop.bad{background:linear-gradient(145deg,#c24a5e,#8f2742);box-shadow:0 16px 44px rgba(255,61,77,.55),inset 0 0 0 3px rgba(255,255,255,.35);text-shadow:0 3px 0 rgba(0,0,0,.25)}
#pop.good{background:linear-gradient(145deg,#4aa987,#2b7a5e);color:#eafff6;box-shadow:0 16px 44px rgba(23,185,120,.5),inset 0 0 0 3px rgba(255,255,255,.45)}
#pop.show{animation:ps 1.5s ease-out}
#pop.bad.show{animation:psb 1.5s ease-out}
@keyframes ps{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) scale(1)}}
@keyframes psb{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}20%{transform:translate(-46%,-50%) rotate(-3deg)}28%{transform:translate(-54%,-50%) rotate(3deg)}36%{transform:translate(-50%,-50%) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%) scale(1)}}
.ov{position:fixed;inset:0;background:rgba(10,6,30,.72);backdrop-filter:blur(8px);display:none;place-items:center;z-index:40;padding:20px}
.ov.on{display:grid}
.card{background:var(--cell);color:var(--ink);border:3px solid transparent;background-image:linear-gradient(var(--cell),var(--cell)),conic-gradient(from 200deg,#ff3d81,#ffb02e,#3dd6a0,#3d8bff,#9b5cff,#ff3d81);background-origin:border-box;background-clip:padding-box,border-box;border-radius:28px;padding:28px 22px;max-width:410px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .4s}
.stars{font-size:46px;letter-spacing:4px;color:var(--gold);line-height:1.1;filter:drop-shadow(0 4px 10px rgba(255,198,26,.5))}
.stars span{display:inline-block;animation:pop .5s both}
.stars .off{color:var(--line);filter:none}
.big{font-size:64px;line-height:1.1}
.card h2{margin:8px 0 4px;font-size:23px;font-weight:900;line-height:1.2}
.card p{margin:0 0 16px;color:var(--mute);font-size:15px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.res div{background:var(--peer);border-radius:14px;padding:10px 4px}
.res small{display:block;color:var(--mute);font-size:11px}
.res b{font-size:20px}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.c.bad,.c.pop,.card,.stars span{animation:none}.chip,.c{transition:none}#pop.show,#pop.bad.show{animation:psr 1.5s}@keyframes psr{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}}
.lb{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 16px;backdrop-filter:blur(10px)}
.lb h2{margin:0 0 12px;font-size:20px;font-weight:900;text-align:center}
.lb .chips{margin-bottom:10px}
.lbs{margin:0 0 8px;text-align:center;color:var(--mute);font-size:13px;min-height:19px}
#lbl{list-style:none;margin:0;padding:0}
#lbl li{display:flex;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--line)}
#lbl li:last-child{border-bottom:0}
#lbl li.me{background:var(--peer);border-radius:12px}
#lbl .rk{width:32px;text-align:center;font-weight:800;font-size:18px}
#lbl .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#lbl .ps{font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold)}
.nmw{display:flex;gap:8px;margin-bottom:14px}
.nmw input{flex:1;min-width:0;border:1px solid var(--line);background:var(--peer);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit}
.nmw .btn{flex:none;padding:11px 16px}
</style>
</head>
<body>
<main>
  <h1>Sudoku<em>Chán Mớ Đời</em></h1>
  <p class="sub">Điền sai bị chửi, điền đúng cũng bị chê. Dám thử không?</p>
  <div class="stats">
    <div class="st"><small>⭐ Điểm</small><b id="sc">0</b></div>
    <div class="st"><small>🔥 Chuỗi</small><b id="stk">0</b></div>
    <div class="st"><small>⏱️ Giờ</small><b id="tm">00:00</b></div>
    <div class="st"><small>Mạng</small><b class="hearts" id="hp"></b></div>
  </div>
  <div class="chips" id="lv"></div>
  <div class="bwrap"><div class="board" id="bd" role="grid" aria-label="Bảng Sudoku"></div></div>
  <div class="pad" id="pd"></div>
  <div class="acts"><button class="btn" id="hint">Gợi ý (-20 điểm)</button><button class="btn pri" id="new">Ván mới</button></div>
  <section class="lb" id="lb" aria-label="Bảng xếp hạng">
    <h2>🏆 Bảng xếp hạng</h2>
    <div class="chips" id="lbt"></div>
    <p class="lbs" id="lbs"></p>
    <ol id="lbl"></ol>
  </section>
</main>
<canvas id="cf"></canvas>
<div id="pop" aria-live="assertive"></div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
var LV=[{n:"Dễ",g:40,m:1,lim:600},{n:"Vừa",g:32,m:1.5,lim:900},{n:"Khó",g:26,m:2,lim:1500}];
var BAD=["NGU NHƯ BÒ! Điền cái gì thế hả?","NGU! Não để quên ở nhà à?","Sai! Con mèo bấm bừa còn khá hơn bạn","NGU! Về học lại lớp 1 đi, đừng phí thời gian","Trời ơi ngu! Có nhìn bảng không vậy?","NGU HẾT THUỐC CHỮA!","Sai bét! Đoán mò cũng không trúng nổi à?","NGU! Cả nhà đang cười bạn đấy","Đồ ngu! Sudoku không phải xổ số đâu","NGU! Đầu để đội mũ hay để suy nghĩ vậy?","Sai rồi con ơi! Ngu thế này ai dạy?","NGU! Đến cái máy cũng xấu hổ thay bạn","Điền thế mà cũng dám bấm, gan thật, ngu thật!"];
var GOOD=["Lại đúng à, chán mớ đời","Đúng rồi... chán ghê, không có gì để chê","Lại đúng à? Chán mớ đời thật sự","Tạm gọi là biết điền, chán mớ đời","Lại đúng! Chán mớ đời, không có gì để mắng","Ừ đúng, vui chưa? Chán mớ đời","Giỏi quá nhỉ, chán mớ đời"];
var EB=["🤡","💀","🙈","😵‍💫","🫠"],EG=["😏","🙄","😒","🥱","😮‍💨"];
var lv=0,sol,puz,val,fix,bad,sel=-1,mist,score,streak,hints,secs,over,timer,best={};
try{best=JSON.parse(localStorage.getItem("sdk-best")||"{}")}catch(e){}
function rnd(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function cand(g,i){var r=(i/9)|0,c=i%9,u=0,k,a,b,br=r-r%3,bc=c-c%3;
  for(k=0;k<9;k++){u|=1<<g[r*9+k];u|=1<<g[k*9+c]}
  for(a=0;a<3;a++)for(b=0;b<3;b++)u|=1<<g[(br+a)*9+bc+b];
  return ~u&0x3FE}
function bits(m){var o=[],d;for(d=1;d<10;d++)if(m&(1<<d))o.push(d);return o}
function best1(g){var bi=-1,bm=0,bc=10,i,m,c;
  for(i=0;i<81;i++)if(!g[i]){m=cand(g,i);c=bits(m).length;if(c<bc){bc=c;bi=i;bm=m;if(c<2)break}}
  return [bi,bm,bc]}
function fill(g){var b=best1(g);if(b[0]<0)return true;
  var ds=rnd(bits(b[1])),k;for(k=0;k<ds.length;k++){g[b[0]]=ds[k];if(fill(g))return true}
  g[b[0]]=0;return false}
function count(g,lim){var b=best1(g);if(b[0]<0)return 1;if(!b[2])return 0;
  var ds=bits(b[1]),n=0,k;for(k=0;k<ds.length;k++){g[b[0]]=ds[k];n+=count(g,lim-n);if(n>=lim)break}
  g[b[0]]=0;return n}
function gen(){
  var g=[],i;for(i=0;i<81;i++)g.push(0);fill(g);sol=g.slice();
  var p=g.slice(),rem=0,tg=81-LV[lv].g,o=rnd(Array.apply(null,Array(81)).map(function(_,i){return i}));
  for(i=0;i<81&&rem<tg;i++){var s=p[o[i]];p[o[i]]=0;if(count(p,2)!==1)p[o[i]]=s;else rem++}
  puz=p;
}
var bd=document.getElementById("bd"),cells=[];
(function(){for(var i=0;i<81;i++){var b=document.createElement("button"),r=(i/9)|0,c=i%9;
  b.className="c"+(c%3===2?" r3":"")+(r%3===2?" b3":"")+(c===8?" r8":"")+(r===8?" b8":"");
  b.setAttribute("role","gridcell");(function(i){b.onclick=function(){sel=i;render()}})(i);bd.appendChild(b);cells.push(b)}})();
var pd=document.getElementById("pd"),pads=[];
(function(){for(var d=1;d<10;d++){var b=document.createElement("button");b.innerHTML=d+"<i></i>";b.style.setProperty("--h",d*38);(function(d){b.onclick=function(){input(d)}})(d);pd.appendChild(b);pads.push(b)}})();
var lvb=document.getElementById("lv");
LV.forEach(function(l,i){var b=document.createElement("button");b.className="chip";b.textContent=l.n;b.onclick=function(){lv=i;start()};lvb.appendChild(b)});
function fmt(s){return("0"+Math.floor(s/60)).slice(-2)+":"+("0"+s%60).slice(-2)}
function render(){
  var i,sv=sel>=0?val[sel]:0,r,c;
  for(i=0;i<81;i++){var e=cells[i],cl=e.className.replace(/ ?(peer|same|sel|l|bad)\b/g,"");
    if(sel>=0){r=(sel/9)|0;c=sel%9;var ri=(i/9)|0,ci=i%9;
      if(i!==sel&&(ri===r||ci===c||(ri-ri%3===r-r%3&&ci-ci%3===c-c%3)))cl+=" peer";
      if(sv&&val[i]===sv&&!bad[i]&&i!==sel)cl+=" same"}
    if(i===sel)cl+=" sel";if(!fix[i]&&val[i]&&!bad[i])cl+=" l";if(bad[i])cl+=" bad";
    e.className=cl;e.textContent=val[i]||"";}
  for(var d=1;d<10;d++){var n=0;for(i=0;i<81;i++)if(val[i]===d&&!bad[i])n++;
    pads[d-1].disabled=n>=9||over;pads[d-1].lastChild.textContent=9-n>0?9-n:""}
  document.getElementById("sc").textContent=score;
  document.getElementById("stk").textContent=streak;
  document.getElementById("hp").textContent=Array(6).join("x").split("").map(function(_,k){return k<5-mist?"❤️":"🖤"}).join("");
  [].forEach.call(lvb.children,function(b,k){b.setAttribute("aria-pressed",k===lv)});
}
var pop=document.getElementById("pop");
function say(t,kind){pop.className="";pop.innerHTML="";var e=document.createElement("span");e.className="em";e.textContent=pick(kind==="bad"?EB:EG);pop.appendChild(e);pop.appendChild(document.createTextNode(t));void pop.offsetWidth;pop.className=kind+" show"}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function done(){for(var i=0;i<81;i++)if(val[i]!==sol[i])return false;return true}
function input(d,hint){
  if(over||sel<0||fix[sel]||bad[sel]||(val[sel]&&val[sel]===sol[sel]))return;
  var i=sel;
  if(d!==sol[i]){
    val[i]=d;bad[i]=true;mist++;streak=0;score=Math.max(0,score-15);
    say(pick(BAD),"bad");render();
    setTimeout(function(){if(bad[i]&&val[i]===d){val[i]=0;bad[i]=false;render()}},900);
    if(mist>=5)finish(false);
    return;
  }
  val[i]=d;streak++;score+=10+Math.min(streak,10)*2;
  say(pick(GOOD),"good");render();cells[i].classList.add("pop");
  if(done())finish(true);
}
document.getElementById("hint").onclick=function(){
  if(over)return;
  var i=sel;if(i<0||fix[i]||val[i]===sol[i]){var e=[];for(var k=0;k<81;k++)if(val[k]!==sol[k]&&!bad[k])e.push(k);if(!e.length)return;i=pick(e);sel=i}
  bad[i]=false;val[i]=sol[i];hints++;score=Math.max(0,score-20);render();
  if(done())finish(true);
};
document.getElementById("new").onclick=start;
function finish(win){
  over=true;clearInterval(timer);render();
  var L=LV[lv],ov=document.getElementById("ov"),card=document.getElementById("card"),html;
  if(win){
    var bonus=Math.round(Math.max(0,600-secs)*L.m);score+=bonus;
    var pen=mist+hints*.75+(secs>L.lim?1:0),st=Math.max(1,Math.min(5,Math.round(5-pen)));
    var T=["Ngu như bò mà vẫn xong, kỳ tích!","Sai lắm vào mà cũng xong, ăn may rồi","Tạm được, ngu vừa phải","Khá lắm, chán mớ đời","Thiên tài à? Chán mớ đời!"];
    var key=L.n,isBest=!best[key]||score>best[key];if(isBest){best[key]=score;try{localStorage.setItem("sdk-best",JSON.stringify(best))}catch(e){}}
    var stars="";for(var k=1;k<6;k++)stars+='<span class="'+(k<=st?"":"off")+'" style="animation-delay:'+(k*.12)+'s">★</span>';
    html='<div class="stars">'+stars+'</div><h2>'+T[st-1]+'</h2><p>Bạn đã giải xong ván '+L.n.toLowerCase()+'.'+(isBest?" Kỷ lục mới!":"")+'</p><div class="res"><div><small>Điểm</small><b>'+score+'</b></div><div><small>Thời gian</small><b>'+fmt(secs)+'</b></div><div><small>Sai / Gợi ý</small><b>'+mist+" / "+hints+'</b></div></div>'+(DBX?'<div class="nmw"><input id="nmi" maxlength="14" placeholder="Tên của bạn" aria-label="Tên của bạn"><button class="btn" id="sv" type="button">Lưu điểm</button></div><p id="svm" style="margin:-6px 0 14px;font-size:13px;color:var(--mute)"></p>':'')+'<button class="btn pri" id="again" style="width:100%">Chơi ván mới</button>';
  }else{
    html='<div class="big">💀</div><h2>Thua thảm! Ngu thế này bỏ cuộc cho rồi</h2><p>Hết 5 mạng, não bạn nghỉ việc từ lâu rồi. Điểm: '+score+'.</p><button class="btn pri" id="again" style="width:100%">Chơi lại</button>';
  }
  card.innerHTML=html;ov.className="ov on";if(win){burst();bindSave(score,lv)}
  document.getElementById("again").onclick=function(){ov.className="ov";start()};
}
var cf=document.getElementById("cf"),cx=cf.getContext("2d"),CC=["#ff3d81","#ffb02e","#3dd6a0","#3d8bff","#9b5cff","#ffd23f"];
function burst(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var W=cf.width=innerWidth,H=cf.height=innerHeight,P=[],n,f=0;
  for(n=0;n<170;n++)P.push({x:W/2,y:H*.35,vx:(Math.random()-.5)*18,vy:-Math.random()*16-3,s:5+Math.random()*8,c:CC[n%CC.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  (function step(){
    cx.clearRect(0,0,W,H);
    P.forEach(function(p){p.vy+=.33;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cx.restore()});
    if(++f<190)requestAnimationFrame(step);else cx.clearRect(0,0,W,H);
  })();
}
function start(){
  gen();val=puz.slice();fix=puz.map(function(v){return v>0});bad=puz.map(function(){return false});
  sel=-1;mist=0;score=0;streak=0;hints=0;secs=0;over=false;
  clearInterval(timer);document.getElementById("tm").textContent="00:00";
  timer=setInterval(function(){secs++;document.getElementById("tm").textContent=fmt(secs)},1000);
  for(var i=0;i<81;i++)if(!fix[i]){sel=i;break}
  render();
}
document.addEventListener("keydown",function(e){
  if(/^[1-9]$/.test(e.key)){input(+e.key);return}
  var m={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[e.key];
  if(m&&sel>=0){var n=sel+m;if(n>=0&&n<81&&!(m===1&&sel%9===8)&&!(m===-1&&sel%9===0)){sel=n;render();e.preventDefault()}}
});
/* Bảng xếp hạng */
var DBX=null,UID=null,rows=[],lbTab=0,nm="",FLD=["sD","sV","sK"];
try{nm=localStorage.getItem("sdk-name")||""}catch(e){}
var lbt=document.getElementById("lbt");
LV.forEach(function(l,i){var b=document.createElement("button");b.className="chip";b.textContent=l.n;b.onclick=function(){lbTab=i;renderLB()};lbt.appendChild(b)});
function renderLB(){
  var box=document.getElementById("lbl"),st=document.getElementById("lbs"),f=FLD[lbTab],list;
  box.innerHTML="";
  [].forEach.call(lbt.children,function(b,k){b.setAttribute("aria-pressed",k===lbTab)});
  if(DBX){
    list=rows.filter(function(r){return r[f]>0}).sort(function(a,b){return b[f]-a[f]}).slice(0,20);
    st.textContent=list.length?"Top "+list.length+" người chơi độ "+LV[lbTab].n.toLowerCase():"Chưa có ai lên bảng. Hãy là người đầu tiên!";
  }else{
    list=[];var bs=best[LV[lbTab].n];
    if(bs){var o={name:nm||"Bạn",id:"me"};o[f]=bs;list=[o];UID="me"}
    st.textContent="Bảng chung chỉ hoạt động trên liên kết claude.ai. Đây là điểm cao nhất của bạn trên máy này.";
  }
  list.forEach(function(r,k){
    var li=document.createElement("li"),a=document.createElement("span"),b=document.createElement("span"),c=document.createElement("span");
    if(r.id===UID)li.className="me";
    a.className="rk";a.textContent=k<3?["🥇","🥈","🥉"][k]:String(k+1);
    b.className="pn";b.textContent=(r.name||"Ẩn danh")+(r.id===UID?" (bạn)":"");
    c.className="ps";c.textContent=r[f];
    li.appendChild(a);li.appendChild(b);li.appendChild(c);box.appendChild(li);
  });
}
function lbMsg(t){document.getElementById("lbs").textContent=t}
function lbInit(){
  renderLB();
  if(!(window.claude&&claude.use))return;
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    if(!r[0]||!r[1])return;
    return r[1].id().then(function(id){
      DBX=r[0];UID=id;renderLB();lbMsg("Đang tải bảng xếp hạng...");
      var tm=setTimeout(function(){lbMsg("Chưa kết nối được bảng xếp hạng chung.")},10000);
      DBX.collection("board").onSnapshot(function(sn){
        clearTimeout(tm);
        rows=sn.docs.map(function(d){var x=Object.assign({},d.data()||{});x.id=d.id;return x});
        renderLB();
      },function(){clearTimeout(tm);lbMsg("Không đọc được bảng xếp hạng.")});
    });
  }).catch(function(){});
}
function bindSave(sc,l){
  var inp=document.getElementById("nmi"),btn=document.getElementById("sv"),m=document.getElementById("svm");
  if(!inp||!btn)return;
  inp.value=nm;
  btn.onclick=function(){
    var n=inp.value.trim().slice(0,14);
    if(!n){m.textContent="Hãy nhập tên để lên bảng.";return}
    if(!UID){m.textContent="Bạn cần đăng nhập để lưu điểm.";return}
    btn.disabled=true;nm=n;try{localStorage.setItem("sdk-name",n)}catch(e){}
    var ref=DBX.collection("board").doc(UID),f=FLD[l];
    ref.get().then(function(sn){
      var o=sn.exists&&sn.data()?Object.assign({},sn.data()):{};
      if(!(o[f]>=sc))o[f]=sc;o.name=n;o.u=Date.now();return ref.set(o);
    }).then(function(){m.textContent="Đã lưu! Xem bảng xếp hạng bên dưới.";lbTab=l;renderLB()})
    .catch(function(){btn.disabled=false;m.textContent="Chưa lưu được. Người chia sẻ cần cấp quyền Contributor cho bạn."});
  };
}
start();
lbInit();
</script>
